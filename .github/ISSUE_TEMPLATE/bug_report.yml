name: Bug report
description: Something in the package does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A question about the API itself, your plan or a flight's data is answered faster on [Telegram](https://t.me/flightbyte). A security issue goes by email, as [SECURITY.md](https://github.com/FlightByte-dev/flightbyte-python/security/policy) explains, never here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code that shows it
      description: The smallest snippet that reproduces it, and the full error and traceback.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: The output of `pip show flightbyte`, or `python -c "import flightbyte; print(flightbyte.__version__)"`.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where it runs
      multiple: true
      options:
        - A web service (Flask, Django, FastAPI or another)
        - A worker or task queue (Celery, RQ or another)
        - A script, CLI or notebook
        - Other
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Python version and operating system
      description: For example the output of `python --version`, and Linux, macOS or Windows.
      placeholder: Python 3.13.2 on Linux
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request id
      description: For an error from the API, `APIError.request_id`. It lets us find the request in our logs.
  - type: checkboxes
    id: secrets
    attributes:
      label: Before you submit
      options:
        - label: I removed every API key and webhook signing secret from this report.
          required: true
